<?xml version="1.0" encoding="UTF-8"?>
<!--
  Agent-in-Box · 项目图标「盒中智能体」
  风格：延续「时间线」图标的纯黑白、粗记号笔手绘：一只微微歪斜的粗黑方框。
  内容：方框就是 VM 的盒子，盒子里探出一个带天线的智能体面孔；手绘的不规则
        笔触与实心圆点保留印章感，小尺寸下仍能读成「框里有个 Agent」。
  说明：本 SVG 为唯一源文件；站点图标直接使用，桌面图标由它导出 PNG/ICO。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agent-in-Box">
  <rect width="64" height="64" rx="14" fill="#fff"/>
