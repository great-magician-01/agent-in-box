name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test and build
        run: pnpm check

      - name: Package self-contained control plane
        run: pnpm package:control-plane

      - name: Package Guest Agent binaries
        run: pnpm package:guest-agent

      - name: Vet Go packages
        run: go vet ./...

      - name: Cross-compile the Windows Guest Agent
        run: go build ./...
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"

      - name: Race-test stateful Go packages
        run: go test -race ./internal/vmprovider ./internal/vmsupervisor ./internal/imagedownload ./internal/guestagent

      - name: Run phase 2 service smoke test
        run: pnpm smoke:phase2

      - name: Run phase 3 service smoke test
        run: pnpm smoke:phase3
        env:
          AGENT_IN_BOX_PHASE3_RESULT: ${{ runner.temp }}/phase3-smoke.json

      - name: Run phase 4 service smoke test
        run: pnpm smoke:phase4
        env:
          AGENT_IN_BOX_PHASE4_RESULT: ${{ runner.temp }}/phase4-smoke.json

      - name: Run phase 5 project and task service smoke test
        run: pnpm smoke:phase5
        env:
          AGENT_IN_BOX_PHASE5_RESULT: ${{ runner.temp }}/phase5-smoke.json

      - name: Run phase 6 Worker and Model Broker smoke test
        run: pnpm smoke:phase6
        env:
          AGENT_IN_BOX_PHASE6_RESULT: ${{ runner.temp }}/phase6-smoke.json

      - name: Run phase 7 Computer Use, policy and completion smoke test
        run: pnpm smoke:phase7
        env:
          AGENT_IN_BOX_PHASE7_RESULT: ${{ runner.temp }}/phase7-smoke.json

      - name: Run phase 8 Router, registry and archive smoke test
        run: pnpm smoke:phase8
        env:
          AGENT_IN_BOX_PHASE8_RESULT: ${{ runner.temp }}/phase8-smoke.json

      - name: Run phase 9 resource, sharing and sync smoke test
        run: pnpm smoke:phase9
        env:
          AGENT_IN_BOX_PHASE9_RESULT: ${{ runner.temp }}/phase9-smoke.json

      - name: Run phase 10 Feishu and QQ bot smoke test
        run: pnpm smoke:phase10
        env:
          AGENT_IN_BOX_PHASE10_RESULT: ${{ runner.temp }}/phase10-smoke.json

      - name: Run phase 11 local Web auth, notifications and inbox smoke test
        run: pnpm smoke:phase11
        env:
          AGENT_IN_BOX_PHASE11_RESULT: ${{ runner.temp }}/phase11-smoke.json

      - name: Run phase 12 security, recovery and performance smoke test
        run: pnpm smoke:phase12
        env:
          AGENT_IN_BOX_PHASE12_RESULT: ${{ runner.temp }}/phase12-smoke.json

      - name: Run phase 13 Windows Guest and mixed-OS smoke test
        run: pnpm smoke:phase13
        env:
          AGENT_IN_BOX_PHASE13_RESULT: ${{ runner.temp }}/phase13-smoke.json

      - name: Package Linux guest runtime assets
        run: pnpm package:guest-runtime

      - name: Run phase 14 model profiles, observer and provisioning smoke test
        run: pnpm smoke:phase14
        env:
          AGENT_IN_BOX_PHASE14_RESULT: ${{ runner.temp }}/phase14-smoke.json

      - name: Validate Windows Guest PowerShell and unattend assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem images/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($_.FullName): $($errors[0].Message)"
            }
          }
          [xml](Get-Content -Raw images/windows/unattend/autounattend.xml.example) | Out-Null

      - name: Upload phase 13 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase13-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase13-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 14 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase14-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase14-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 12 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase12-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase12-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 11 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase11-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 10 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase10-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase10-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 9 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase9-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 8 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase8-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase8-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 7 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase7-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 6 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase6-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 5 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase5-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 4 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase4-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 3 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase3-smoke.json
          if-no-files-found: error
          retention-days: 7
