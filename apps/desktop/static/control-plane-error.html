<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent-in-Box · 本地服务未就绪</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f2f1eb;
        color: #18201c;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 5%, rgba(201, 121, 58, 0.14), transparent 32rem), #f2f1eb;
      }
      main {
        width: min(560px, calc(100% - 3rem));
        padding: 2.2rem;
        border: 1px solid rgba(24, 32, 28, 0.12);
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 24px 60px rgba(43, 47, 39, 0.08);
      }
      .eyebrow {
        margin: 0 0 0.8rem;
        color: #9a5a2f;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.18em;
      }
      h1 {
        margin: 0 0 0.8rem;
        font-size: 1.7rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 0.8rem;
        color: #5d665f;
        line-height: 1.7;
        font-size: 0.92rem;
      }
      .status {
        margin: 1.2rem 0;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        background: rgba(163, 64, 50, 0.08);
        color: #6d2e25;
        font-size: 0.85rem;
        word-break: break-word;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 1.4rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.72rem 1.2rem;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: #2c5e4b;
        color: white;
      }
      .secondary {
        background: rgba(24, 32, 28, 0.08);
        color: #18201c;
      }
      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }
      code {
        font-size: 0.78rem;
        color: #6d756e;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">AGENT-IN-BOX · LOCAL SERVICE</p>
      <h1>本地服务还没有就绪</h1>
      <p>
        界面已加载，但本地控制平面未能在预期时间内响应。服务可能在启动、崩溃或端口被占用。你的数据不会因此被删除。
      </p>
      <div class="status" id="status">正在读取本地服务状态…</div>
      <p><code id="log-path"></code></p>
      <div class="actions">
        <button class="primary" id="retry">重新启动本地服务</button>
        <button class="secondary" id="logs">打开日志目录</button>
        <button class="secondary" id="quit">退出应用</button>
      </div>
    </main>
    <script>
      (() => {
        const statusElement = document.getElementById("status");
        const logPathElement = document.getElementById("log-path");
        const retryButton = document.getElementById("retry");
        let redirecting = false;

        function render(status) {
          if (!status) {
            statusElement.textContent = "桌面桥接不可用；请从桌面应用启动，或按日志排查。";
            return;
          }
          const controlPlane = status.controlPlane;
          logPathElement.textContent = `日志：${status.logDirectory}`;
          statusElement.textContent = [
            `状态：${controlPlane.state}`,
            `端口：${controlPlane.port}`,
            controlPlane.message ? `信息：${controlPlane.message}` : null,
            controlPlane.lastExitCode !== null ? `退出码：${controlPlane.lastExitCode}` : null,
          ]
            .filter(Boolean)
            .join("\n");
          if (controlPlane.state === "running" || controlPlane.state === "external") {
            if (!redirecting) {
              redirecting = true;
              window.location.replace(`http://127.0.0.1:${controlPlane.port}/`);
            }
          }
        }

        async function refresh() {
          if (!window.agentInBox) {
            render(null);
            return;
          }
          try {
            render(await window.agentInBox.app.status());
          } catch (error) {
            statusElement.textContent = `读取状态失败：${String(error)}`;
          }
        }

        retryButton.addEventListener("click", async () => {
          if (!window.agentInBox) {
            return;
          }
          retryButton.disabled = true;
          statusElement.textContent = "正在重新启动本地服务…";
          try {
            render(await window.agentInBox.app.restartControlPlane());
          } catch (error) {
            statusElement.textContent = `重启失败：${String(error)}`;
          } finally {
            retryButton.disabled = false;
          }
        });

        document.getElementById("logs").addEventListener("click", () => {
          void window.agentInBox?.app.openLogs();
        });
        document.getElementById("quit").addEventListener("click", () => {
          void window.agentInBox?.app.quit();
        });

        void refresh();
        window.setInterval(() => void refresh(), 2000);
      })();
    </script>
  </body>
</html>
