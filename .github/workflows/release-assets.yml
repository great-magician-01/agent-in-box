name: Release assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish, for example v0.1.0
        required: true
        type: string
      artifacts_run_id:
        description: Optional prior run ID whose verified artifacts should be republished without rebuilding
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-assets-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged commit
    if: ${{ inputs.artifacts_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate release tag and package versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: go vet ./...

  desktop:
    name: Desktop ${{ matrix.name }}
    needs: verify
    if: ${{ inputs.artifacts_run_id == '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: release/agent-in-box-*-windows-x64.exe
            smoke: pnpm smoke:desktop
          - name: linux-x64
            os: ubuntu-latest
            artifact: release/agent-in-box-*-linux-x64.AppImage
            smoke: xvfb-run -a pnpm smoke:desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Build self-contained desktop installer
        run: pnpm package:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged desktop
        run: ${{ matrix.smoke }}
      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  qemu-windows:
    name: QEMU Windows toolchain
    needs: verify
    if: ${{ inputs.artifacts_run_id == '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - name: Package QEMU
        shell: pwsh
        run: ./scripts/package-qemu-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-windows
          path: |
            release/qemu/qemu-windows-x64.tar.gz
            release/qemu/qemu-windows-x64.tar.gz.sha256
            release/qemu/qemu-windows-x64.json
          if-no-files-found: error

  guest-runtime:
    name: Linux guest runtime
    needs: verify
    if: ${{ inputs.artifacts_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - name: Package guest runtime
        run: node scripts/package-guest-runtime.mjs
      - name: Archive guest runtime
        run: |
          tar -czf release/guest-runtime-linux-amd64.tar.gz \
            -C release/guest-runtime/linux-amd64 .
          sha256sum release/guest-runtime-linux-amd64.tar.gz \
            > release/guest-runtime-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: guest-runtime
          path: |
            release/guest-runtime-linux-amd64.tar.gz
            release/guest-runtime-linux-amd64.tar.gz.sha256
            release/guest-runtime/linux-amd64/manifest.json
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: [desktop, qemu-windows, guest-runtime]
    if: >-
      ${{
        always() &&
        (
          inputs.artifacts_run_id != '' ||
          (
            needs.desktop.result == 'success' &&
            needs['qemu-windows'].result == 'success' &&
            needs['guest-runtime'].result == 'success'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifacts_run_id || github.run_id }}
          merge-multiple: true
          path: runtime-assets
      - name: Build runtime-assets.json
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const tag = process.env.RELEASE_TAG;
          if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Invalid semantic version release tag: ${tag}`);
          }
          const version = tag.slice(1);
          const qemu = JSON.parse(fs.readFileSync("runtime-assets/qemu-windows-x64.json", "utf8"));
          const guest = JSON.parse(
            fs.readFileSync("runtime-assets/guest-runtime/linux-amd64/manifest.json", "utf8"),
          );
          if (guest.guestRuntimeVersion !== version) {
            throw new Error(`Guest runtime version ${guest.guestRuntimeVersion} does not match ${tag}`);
          }
          for (const file of [
            `agent-in-box-${version}-windows-x64.exe`,
            `agent-in-box-${version}-linux-x64.AppImage`,
          ]) {
            if (!fs.existsSync(`runtime-assets/${file}`)) {
              throw new Error(`Desktop artifact does not match ${tag}: ${file}`);
            }
          }
          fs.writeFileSync(
            "runtime-assets/runtime-assets.json",
            `${JSON.stringify({ schemaVersion: 1, qemu: { "windows-x64": qemu }, guestRuntime: guest }, null, 2)}\n`,
          );
          NODE
      - name: Checksum desktop installers
        working-directory: runtime-assets
        run: >-
          sha256sum
          agent-in-box-*-windows-x64.exe
          agent-in-box-*-linux-x64.AppImage
          > desktop-SHA256SUMS
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: ${{ github.event_name == 'push' }}
          files: |
            runtime-assets/qemu-windows-x64.tar.gz
            runtime-assets/qemu-windows-x64.tar.gz.sha256
            runtime-assets/qemu-windows-x64.json
            runtime-assets/guest-runtime-linux-amd64.tar.gz
            runtime-assets/guest-runtime-linux-amd64.tar.gz.sha256
            runtime-assets/runtime-assets.json
            runtime-assets/agent-in-box-*-windows-x64.exe
            runtime-assets/agent-in-box-*-linux-x64.AppImage
            runtime-assets/desktop-SHA256SUMS
          fail_on_unmatched_files: true
