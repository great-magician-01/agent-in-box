name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test and build
        run: pnpm check

      - name: Vet Go packages
        run: go vet ./...

      - name: Race-test stateful Go packages
        run: go test -race ./internal/vmprovider ./internal/vmsupervisor ./internal/imagedownload

      - name: Run phase 2 service smoke test
        run: pnpm smoke:phase2

      - name: Run phase 3 service smoke test
        run: pnpm smoke:phase3
        env:
          AGENT_IN_BOX_PHASE3_RESULT: ${{ runner.temp }}/phase3-smoke.json

      - name: Upload phase 3 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase3-smoke.json
          if-no-files-found: error
          retention-days: 7
