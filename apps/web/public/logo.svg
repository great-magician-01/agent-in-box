    <circle cx="27" cy="33.1" r="2.3" fill="#111"/>
    <circle cx="37" cy="33.1" r="2.3" fill="#111"/>
    <path d="M27.9 38.5C30.3 40.3 33.7 40.3 36.1 38.4" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round"/>
