appId: com.agentinbox.desktop
productName: Agent-in-Box
copyright: Copyright © 2026 Agent-in-Box

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - static/**/*
  - package.json

extraResources:
  - from: ../../release/control-plane
    to: control-plane
    filter:
      - "**/*"
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
  - from: ../../release/vm-supervisor
    to: vm-supervisor
    filter:
      - "**/*"
  - from: ../../release/guest-runtime
    to: guest-runtime
    filter:
      - "**/*"

asar: true
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: agent-in-box-${version}-${arch}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  # Never request administrator rights; install for the current user only.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Agent-in-Box
  include: build/installer.nsh
  # Per-user installs never elevate; this also removes the wine dependency when
  # building the Windows installer from Linux CI.
  packElevateHelper: false

linux:
  target:
    - AppImage
  category: Utility
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.icns

publish: null
