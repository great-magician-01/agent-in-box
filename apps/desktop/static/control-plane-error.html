<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent-in-Box · 本地服务未就绪</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --bg: #fbfbfc;
        --surface: #ffffff;
        --border: #e4e4e8;
        --text: #19191c;
        --text-2: #55555c;
        --muted: #8d8d97;
        --accent: #19191c;
        --on-accent: #ffffff;
        --bad: #b3261e;
        background: var(--bg);
        color: var(--text);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101012;
          --surface: #17171a;
          --border: #28282e;
          --text: #f2f2f4;
          --text-2: #c2c2ca;
          --muted: #8f8f99;
          --accent: #f2f2f4;
          --on-accent: #17171a;
          --bad: #f87171;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
      }
      main {
        width: min(560px, calc(100% - 3rem));
        padding: 2.2rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--surface);
      }
      h1 {
        margin: 0 0 0.8rem;
        font-size: 1.7rem;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 0.8rem;
        color: var(--text-2);
        line-height: 1.7;
        font-size: 0.92rem;
      }
      .status {
        margin: 1.2rem 0;
        padding: 0.9rem 1rem;
        border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent);
        border-radius: 12px;
        background: color-mix(in srgb, var(--bad) 7%, transparent);
        color: var(--bad);
        font-size: 0.85rem;
        word-break: break-word;
        white-space: pre-line;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 1.4rem;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 0.72rem 1.2rem;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }
      .primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .secondary {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
      }
      button:disabled {
        opacity: 0.55;
        cursor: progress;
      }
      code {
        font-size: 0.78rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>本地服务还没有就绪</h1>
      <p>
        界面已加载，但本地控制平面未能在预期时间内响应。服务可能在启动、崩溃或端口被占用。你的数据不会因此被删除。
      </p>
      <div class="status" id="status">正在读取本地服务状态…</div>
      <p><code id="log-path"></code></p>
      <div class="actions">
        <button class="primary" id="retry">重新启动本地服务</button>
        <button class="secondary" id="logs">打开日志目录</button>
        <button class="secondary" id="quit">退出应用</button>
      </div>
    </main>
    <script>
      (() => {
        const statusElement = document.getElementById("status");
        const logPathElement = document.getElementById("log-path");
        const retryButton = document.getElementById("retry");
        let redirecting = false;

        function render(status) {
          if (!status) {
            statusElement.textContent = "桌面桥接不可用；请从桌面应用启动，或按日志排查。";
            return;
          }
          const controlPlane = status.controlPlane;
          logPathElement.textContent = `日志：${status.logDirectory}`;
          statusElement.textContent = [
            `状态：${controlPlane.state}`,
            `端口：${controlPlane.port}`,
            controlPlane.message ? `信息：${controlPlane.message}` : null,
            controlPlane.lastExitCode !== null ? `退出码：${controlPlane.lastExitCode}` : null,
          ]
            .filter(Boolean)
            .join("\n");
          if (controlPlane.state === "running" || controlPlane.state === "external") {
            if (!redirecting) {
              redirecting = true;
              window.location.replace(`http://127.0.0.1:${controlPlane.port}/`);
            }
          }
        }

        async function refresh() {
          if (!window.agentInBox) {
            render(null);
            return;
          }
          try {
            render(await window.agentInBox.app.status());
          } catch (error) {
            statusElement.textContent = `读取状态失败：${String(error)}`;
          }
        }

        retryButton.addEventListener("click", async () => {
          if (!window.agentInBox) {
            return;
          }
          retryButton.disabled = true;
          statusElement.textContent = "正在重新启动本地服务…";
          try {
            render(await window.agentInBox.app.restartControlPlane());
          } catch (error) {
            statusElement.textContent = `重启失败：${String(error)}`;
          } finally {
            retryButton.disabled = false;
          }
        });

        document.getElementById("logs").addEventListener("click", () => {
          void window.agentInBox?.app.openLogs();
        });
        document.getElementById("quit").addEventListener("click", () => {
          void window.agentInBox?.app.quit();
        });

        void refresh();
        window.setInterval(() => void refresh(), 2000);
      })();
    </script>
  </body>
</html>
