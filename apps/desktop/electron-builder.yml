appId: com.agentinbox.desktop
productName: Agent-in-Box
copyright: Copyright © 2026 Agent-in-Box

directories:
  output: ../../release
  buildResources: build

files:
  - dist/**/*
  - static/**/*
  - package.json

extraResources:
  - from: ../../release/control-plane
    to: control-plane
    filter:
      - "**/*"
  - from: ../web/dist
    to: web
    filter:
      - "**/*"
  - from: ../../release/vm-supervisor
    to: vm-supervisor
    filter:
      - "**/*"
  - from: ../../release/guest-runtime
    to: guest-runtime
    filter:
      - "**/*"
  - from: ../../release/router-runtime
    to: router-runtime
    filter:
      - "**/*"
  # Release builds place the Ed25519 update verification key here. The filter
  # keeps local packaging working without a key; the release workflow fails
  # closed instead of shipping a build whose updates cannot be verified.
  - from: build
    to: .
    filter:
      - update-public-key.pem
      - runtime-public-key.pem

asar: true
compression: normal
afterPack: ../../scripts/electron-after-pack.mjs

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: agent-in-box-${version}-windows-${arch}.${ext}
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  # Never request administrator rights; install for the current user only.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  shortcutName: Agent-in-Box
  include: build/installer.nsh
  # Per-user installs never elevate; this also removes the wine dependency when
  # building the Windows installer from Linux CI.
  packElevateHelper: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: agent-in-box-${version}-linux-x64.${ext}
  executableName: agent-in-box
  category: Utility
  icon: build/icon.png

mac:
  target:
    - dmg
  category: public.app-category.productivity
  icon: build/icon.icns

publish: null
