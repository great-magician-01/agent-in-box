name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test and build
        run: pnpm check

      - name: Package self-contained control plane
        run: pnpm package:control-plane

      - name: Vet Go packages
        run: go vet ./...

      - name: Race-test stateful Go packages
        run: go test -race ./internal/vmprovider ./internal/vmsupervisor ./internal/imagedownload ./internal/guestagent

      - name: Run phase 2 service smoke test
        run: pnpm smoke:phase2

      - name: Run phase 3 service smoke test
        run: pnpm smoke:phase3
        env:
          AGENT_IN_BOX_PHASE3_RESULT: ${{ runner.temp }}/phase3-smoke.json

      - name: Run phase 4 service smoke test
        run: pnpm smoke:phase4
        env:
          AGENT_IN_BOX_PHASE4_RESULT: ${{ runner.temp }}/phase4-smoke.json

      - name: Run phase 5 project and task service smoke test
        run: pnpm smoke:phase5
        env:
          AGENT_IN_BOX_PHASE5_RESULT: ${{ runner.temp }}/phase5-smoke.json

      - name: Run phase 6 Worker and Model Broker smoke test
        run: pnpm smoke:phase6
        env:
          AGENT_IN_BOX_PHASE6_RESULT: ${{ runner.temp }}/phase6-smoke.json

      - name: Run phase 7 Computer Use, policy and completion smoke test
        run: pnpm smoke:phase7
        env:
          AGENT_IN_BOX_PHASE7_RESULT: ${{ runner.temp }}/phase7-smoke.json

      - name: Upload phase 7 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase7-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 6 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase6-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 5 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase5-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 4 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase4-smoke.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload phase 3 smoke result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/phase3-smoke.json
          if-no-files-found: error
          retention-days: 7
